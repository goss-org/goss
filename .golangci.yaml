version: "2"
linters:
  default: none
  enable:
    - govet
    - ineffassign
    - staticcheck
    - unused
    - modernize
    - dupword
    - copyloopvar
    - durationcheck
    - errname
    # - errorlint
    - ginkgolinter
    - gocheckcompilerdirectives
    - grouper
    - iface
    - importas
    - ineffassign
    - ineffassign
    - mirror
    - misspell
    #- nilerr
    - nilnesserr
    #- noctx
    - nonamedreturns
    - nosprintfhostport
    #- perfsprint
    #- prealloc
    #- promlinter
    - reassign
    #- revive
    #- testifylint
    #- tparallel
    #- unconvert
    - usetesting
    - whitespace
    #- wrapcheck
  disable:
    - cyclop
    - depguard
    # Disabled because of genny
    - dupl
    - embeddedstructfieldcheck
    - forbidigo
    - funlen
    - funcorder
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - goconst
    - gomodguard
    - exhaustive
    - exhaustruct
    - inamedparam
    - interfacebloat
    - ireturn
    - lll
    - maintidx
    - mnd
    - nlreturn
    - noinlineerr
    - recvcheck
    - tagalign
    - tagliatelle
    - testpackage
    - varnamelen
    - wsl
    - wsl_v5
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
  settings:
    staticcheck:
      checks:
        - all
        # Default exclusions
        - "-ST1000"
        - "-ST1003"
        - "-ST1016"
        - "-ST1020"
        - "-ST1021"
        - "-ST1022"
        # Incorrectly formatted error string: there are a lot of these
        - "-ST1005"
    usetesting:
      os-temp-dir: true
      context-background: true
      context-todo: true
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
