version: "2"
linters:
  default: none
  enable:
    - govet
    - ineffassign
    - sloglint
    - staticcheck
    - unused
  disable:
    - noinlineerr
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
  settings:
    sloglint:
      # The point of #1093 is that log output belongs to the caller, so a global
      # logger is the one thing that must not come back.
      no-global: all
      static-msg: true
      msg-style: lowercased
      key-naming-case: snake
      # util.Trace and util.TraceContext wrap Log/LogAttrs, so sloglint cannot
      # find the message and attributes without being told where they sit.
      # Positions are zero-based.
      custom-funcs:
        - name: github.com/goss-org/goss/util.Trace
          msg-pos: 1
          args-pos: 2
        - name: github.com/goss-org/goss/util.TraceContext
          msg-pos: 2
          args-pos: 3
    staticcheck:
      checks:
        - all
        # Default exclusions
        - "-ST1000"
        - "-ST1003"
        - "-ST1016"
        - "-ST1020"
        - "-ST1021"
        - "-ST1022"
        # Incorrectly formatted error string: there are a lot of these
        - "-ST1005"
# The defaults cap each linter at 50 issues and each identical message at 3,
# which would let a violation hide behind three of its own kind. A gate that
# reports part of the tree is not a gate.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
